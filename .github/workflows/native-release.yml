name: Build native FFmpeg release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New native asset tag, e.g. native-ffmpeg-8.1.3-r2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NATIVE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a new native tag
        run: |
          [[ "$NATIVE_TAG" =~ ^native-ffmpeg-[0-9]+\.[0-9]+\.[0-9]+-r[0-9]+$ ]]
          if gh release view "$NATIVE_TAG" >/dev/null 2>&1; then
            echo "Use a new tag; existing native releases must not be overwritten."
            exit 1
          fi
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config perl cmake python3-venv
          python3 -m venv .native-tools
          .native-tools/bin/pip install meson==1.12.1 ninja==1.13.0
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Build all four architectures
        run: ./build-ffmpeg.sh
      - name: Package binaries, notices, and corresponding sources
        run: bash scripts/package-native.sh "$NATIVE_TAG"
      - name: Publish native assets
        run: |
          gh release create "$NATIVE_TAG" releases/native/* \
            --target "$GITHUB_SHA" --title "FFmpeg native binaries ($NATIVE_TAG)" \
            --notes "Native FFmpeg/ffprobe for API 24+, all four ABIs, with license notices and corresponding source/build instructions. Copy the attached native-release.json into scripts/native-release.json to select this build." \
            --draft --latest=false
          gh release edit "$NATIVE_TAG" --draft=false --latest=false
